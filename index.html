<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poruchy – presunuté do Dispečingu</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1f2933;
       background:linear-gradient(155deg,#eaf3fd 0%,#bcdcfa 100%)}
  .box{background:#fff;padding:32px 36px;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.12);max-width:460px;text-align:center}
  h1{font-size:20px;margin:0 0 12px;color:#0d2b4e}
  p{font-size:14px;line-height:1.5;margin:8px 0}
  a.btn{display:inline-block;margin-top:14px;background:#1565c0;color:#fff;text-decoration:none;
        padding:11px 22px;border-radius:7px;font-weight:600;font-size:15px}
  .pozn{font-size:12px;color:#6b7280;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <h1>⚡ Poruchy sa presunuli</h1>
  <p>Evidencia porúch je odteraz súčasťou aplikácie <b>DISPECING</b>.</p>
  <p>Prihlás sa do Dispečingu svojím e-mailom a heslom z Dispečingu a prepni na <b>🔧 Poruchy</b>.</p>
  <a class="btn" id="odkaz" href="https://brigantjan.github.io/dicpecing-web/">Prejsť do Dispečingu</a>
  <p class="pozn">O <span id="sek">10</span> s ťa presmerujeme automaticky. Ulož si novú adresu medzi obľúbené.</p>
</div>
<script>
  // Staré prihlásenie do Porúch už nie je potrebné – zmaž len kľúč starého webu (ostatné nechaj tak).
  try { localStorage.removeItem('poruchy_auth'); } catch (e) {}
  var s = 10, el = document.getElementById('sek');
  var t = setInterval(function () {
    s--; if (el) el.textContent = s;
    if (s <= 0) { clearInterval(t); window.location.href = document.getElementById('odkaz').href; }
  }, 1000);
</script>
</body>
</html>
